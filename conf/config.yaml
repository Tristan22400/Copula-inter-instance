defaults:
  # Each conf/model/*.yaml is the single file for one experiment: it uses
  # `# @package _global_` to set both `model.*` (the copula head) and
  # `tabicl.*` (the backbone) in one place, so switching experiments is one
  # `model=...` override instead of coordinating a separate `tabicl:` group.
  - model: copula_prod
  - data: gp_tasks
  - _self_

seed: 42

# Multi-process parallel dataset generation only (src/generate_pit_dataset.py,
# launched via scripts/generate_dataset.sh's GEN_WORKERS) -- ignored by
# train.py. worker_id/num_workers default to 0/1 (single process, original
# behaviour); N cooperating processes pointed at the same data.dataset_dir
# each set num_workers=N and a distinct worker_id in [0, N) to partition the
# shard range with no overlap and no coordination beyond the shared pit_dir.
worker_id: 0
num_workers: 1

wandb:
  project: copula-inter-instance
  entity: null   # override with your wandb username/org

training:
  device: auto
  batch_size: 16
  # torch.compile adds real overhead (first-step + recompiles on shape changes);
  # worth it for long runs, a drag while iterating quickly. Off by default.
  compile: false
  steps: 1000000
  warmup_steps: 1000
  clip_grad_norm: 1.0
  log_every: 200
  val_every: 1000
  save_every: 10000
  ckpt_dir: null
  # Path to a checkpoint saved by save_checkpoint() (model + optimizer +
  # scheduler + step). When set, model weights and optimizer/scaler state
  # (Adam/Muon moments, AMP grad scale) are restored, and by default the step
  # counter and LR schedule pick up from the checkpoint's step, continuing
  # the same warmup/cosine curve rather than re-running warmup from a
  # from-scratch peak LR on top of already-warmed-up optimizer moments.
  # `warmup_steps`/`steps`/`muon_lr` etc. still come from this run's config,
  # not the one baked into the checkpoint, so an extended `steps` budget
  # smoothly stretches the remaining decay instead of starting over.
  # Usage: python src/train.py training.resume_ckpt=./checkpoints/copula_transformer/step_0029999.pt
  resume_ckpt: null
  # Set true to opt back into the old behavior: restart at step 0 with a
  # fresh warmup/cosine schedule instead of continuing the checkpoint's.
  # Intended for deliberately warm-starting a new, unrelated experiment
  # (different dataset/config) from an existing checkpoint's weights, where
  # continuing the old run's schedule wouldn't make sense.
  resume_reset_schedule: false
  dataset_dir: ./data/systematic_composition-k5/pit
  # Target validation-set size, shared by both the on-disk path (below, capped
  # at the dataset's total episode count) and live_generation (live_dataset.py)
  # — same knob so the val plots (e.g. val/corr_density_analytic_z) are comparable in
  # point count across modes instead of the disk path silently getting a
  # smaller val set on datasets under ~10k episodes.
  val_episodes: 200
  # Override for the on-disk dataset DataLoader worker count (train.py's
  # loader_num_workers). null keeps the built-in defaults (4 fixed-d, 2
  # variable-d) — set explicitly to tune, e.g. now that dataset.py loads
  # shards with mmap=True instead of an eager full copy.
  loader_num_workers: null
  # Batches queued ahead per DataLoader worker (train.py's prefetch_factor).
  # 8 empirically holds cgroup RSS flat (~7GB, well under a 31GB-capped OAR
  # job) while still getting data-wait down near loss's own cost (~2ms vs
  # ~5ms) on systematic-composition-all-base. Pushing deeper (16, 32) grows
  # RSS enough to OOM-kill the run — the per-batch payload (R_star/R_prior/
  # Sigma_star are full N_max x N_max matrices) is large enough on its own
  # that a 32-deep x num_workers queue fills the cgroup even after fixing
  # the shard-cache's own leak (see dataset.py's _load_shard_entry). Override
  # via training.prefetch_factor to tune further on a different dataset/node.
  prefetch_factor: 8
  # Live generation: skip dataset_dir entirely and generate episodes on the
  # fly via DataLoader workers (see live_dataset.py) — no disk reads/writes
  # for training data. Temporary, storage-constrained-environment mode;
  # false (default) uses the on-disk dataset_dir pipeline unchanged.
  live_generation: true
  # Which live_generation episode source to use, only when live_generation=
  # true. "gp" (default): synthetic GP kernels via live_dataset.py, unchanged
  # behavior. "era5": real, worldwide ARCO-ERA5 2m-temperature episodes via
  # era5_live_dataset.py (see era5_live: below for its knobs) -- for
  # finetuning a checkpoint on real spatial data across many geographic
  # regions and grid resolutions instead of synthetic kernels. Requires a
  # local corpus from `python eval/data/fetch_era5_global.py` first, and a
  # resolvable TabICL checkpoint (tabicl.ckpt/tabicl.pit_ckpt) -- there is no
  # oracle-PIT option for real data, so training.aux_mae_weight is forced to
  # 0.0 automatically under this source (no R_star exists to regress
  # against). See src/finetune_era5.py for a ready-made CLI wrapper.
  live_source: gp
  # CPU-bound generation is heavier than a shard read; size to keep the GPU
  # fed. 16 (not 8) because generate_gp_batch's fixed per-call overhead means
  # aggregate worker throughput doesn't scale with batch_size on its own —
  # measured 8 workers falling behind at batch_size=256 (data=30-55ms/step,
  # more than the rest of the step combined) while 16 stayed flat
  # (data<1ms/step) at both batch_size=128 and 256 on a 44-core node. Bump
  # this further (in step with batch_size) if you have more cores and go
  # bigger; 16 was already at the floor — 24 gave no further improvement.
  # Only applies when data.z_train_source=analytic (the CPU-worker path --
  # see live_tabicl_num_workers below for data.z_train_source=tabicl/
  # tabicl_split, which uses a completely different, GPU-worker path).
  live_num_workers: 16
  # Worker count for data.z_train_source=tabicl/tabicl_split's live-generation
  # path (live_dataset.py::build_live_train_loader) -- ignored when
  # data.z_train_source=analytic. Each worker there runs on the GPU (CPU-only
  # TabICL inference was benchmarked and rejected as far too slow, see that
  # function's docstring), so unlike live_num_workers this isn't sized
  # against CPU core count -- it's sized against how many concurrent frozen
  # TabICL copies (~120MB resident each, ~1.4GB peak per call, measured) the
  # training GPU can hold alongside the training job's own VRAM use. 2 is a
  # deliberately conservative, untuned-for-your-hardware default -- raise it
  # if profiling shows workers falling behind and VRAM allows, lower it if
  # you see CUDA OOMs.
  live_tabicl_num_workers: 2
  # generate_gp_batch() call size = batch_size * live_group_multiplier. Must be
  # a multiple of batch_size: generate_gp_batch samples kernel/P/N/active_dims
  # (and, for variable-d configs, d_features itself) once per call, shared by
  # every episode in it — collate_fn cannot pad across a mismatched feature
  # axis, so a batch straddling two differently-sampled calls would fail
  # exactly like the disk path's variable-d datasets without
  # ShardHomogeneousBatchSampler. 1 (one call per batch) is also close to the
  # throughput ceiling: generate_gp_batch has ~1s of fixed per-call setup
  # overhead, benchmarked ~1.2s/episode at call-size 1 vs ~0.03s/episode at
  # call-size 32 (2026-07-23) — small call sizes are both less safe and far
  # slower. Cross-batch diversity comes from live_num_workers running
  # independently-seeded streams, the live analogue of ShardBlockSampler.
  live_group_multiplier: 1
  live_val_seed: 20260723  # fixed seed for the validation set (independent of the training seed stream)
  # For sharded datasets: shuffle within blocks of this many shards at a time
  # (all shuffled together, IO-cache resident) instead of one global shuffle
  # across every shard — avoids thrashing the shard LRU cache on network
  # storage. Still a true per-epoch permutation, just chunked randomization.
  shard_block_shards: 16
  plot_val_every: 1000  # generate val plots every N steps (0 = never)
  # Adaptive kernel-family sampling for live generation: bias
  # live_dataset.py's kernel-chain sampling (data_gen._sample_kernel_chain_
  # structure) toward the kernel families the model currently fits worst,
  # instead of sampling _COMPOSABLE_KERNELS uniformly. Only takes effect when
  # live_generation=true AND cfg.data.systematic_composition=true (the active
  # sampling path this feature hooks into). Uses the existing per-family
  # kernel_fit/<family>/{copula_nll,oracle_copula_nll} validation probes
  # (baselines.* below) as the performance signal — DoReMi/GroupDRO-style
  # exponentiated-gradient update on the oracle gap (regret), see
  # train.py::_update_adaptive_kernel_weights. false (default) leaves
  # sampling exactly as before this feature existed.
  adaptive_kernel_sampling: true
  # Exponentiated-gradient step size η applied to the per-family oracle gap
  # (copula_nll - oracle_copula_nll, typically O(0.1-1) in this codebase's
  # units — unlike the cross-entropy-scale losses DoReMi tuned η against, so
  # this default is a starting point, not a validated value; watch
  # val/kernel_sampling_weight/<family> for over/under-reaction and adjust).
  adaptive_kernel_lr: 1.0
  # Uniform-blend floor per family after each update (DoReMi-style
  # anti-starvation term) — keeps every family's sampling weight above
  # floor/len(_COMPOSABLE_KERNELS) even if it looks perfectly fit, so it
  # still gets occasional practice instead of being fully dropped from the
  # curriculum.
  adaptive_kernel_floor: 0.05
  # Which per-family regret signal adaptive_kernel_sampling above chases (see
  # train.py::_update_adaptive_kernel_weights):
  #   "tabicl" (default) -- kernel_fit/<family>/gap_nll_tabicl: the model's
  #     total Y-space NLL scored against TabICL's own frozen K-fold PIT (a
  #     real, imperfect marginal), minus gp_analytical_posterior's true
  #     Bayes-optimal ceiling for that family -- biases live-generation
  #     sampling toward families where the model performs worst under a
  #     realistic, non-oracle marginal (the deployment-facing signal, not the
  #     idealized one). Only available once a PIT checkpoint is configured
  #     (see pit.py::resolve_pit_ckpt); any family missing it (no PIT
  #     checkpoint, or a degenerate probe) falls back to that family's own
  #     oracle gap below rather than zeroing its signal.
  #   "oracle" -- oracle_diag/kernel_fit/<family>/gap_nll instead: the
  #     identical gap, but scored against the exact analytic-GP PIT rather
  #     than TabICL's approximation of it.
  adaptive_kernel_signal: tabicl
  # Muon optimizer (Jordan et al. 2024b / Moonlight Liu et al. 2025)
  muon_lr: 2.0e-4             # base LR; effective LR = muon_lr * 0.2 * sqrt(max(n,m))
  muon_lr_min: 1.0e-6         # cosine decay floor
  muon_momentum: 0.95
  muon_weight_decay: 0.01     # cautious weight decay (Chen et al. 2025a)
  muon_matched_adamw_rms: 0.2
  muon_ns_steps: 5
  muon_nesterov: true
  
  muon_adamw_betas: [0.95, 0.95]
  muon_adamw_eps: 1.0e-8
  # Scalar weight on the Y-space NLL (copula + marginal); 1.0 = standard.
  nll_weight: 1.0
  # Auxiliary MAE (L1) loss on off-diagonal correlations vs oracle R_star.
  # Provides a direct gradient signal and, unlike MSE, pushes near-zero
  # correlations to exact zero — encourages sparsity in the predicted
  # covariance structure. 0.0 disables it entirely.
  aux_mae_weight: 0.0

# Model-fit-to-classical-kernel diagnostic, evaluated each validation loop:
#   val/kernel_fit/<kernel>/{copula_nll,corr_mse,corr_mae,corr_pearson}
# For each kernel family below, a fixed batch of synthetic episodes is
# generated once (at startup) via data_gen.generate_gp_batch — the same
# (x_train, z_train, x_test, R_star, ...) construction as real training data,
# but with the generative kernel forced to that single family instead of this
# run's usual composite/systematic mixture. Every validation call then runs
# the CURRENT model on this frozen probe set, so kernel_fit/<kernel> moves
# with training progress (unlike a fixed, data-only baseline would).
baselines:
  enabled: true
  # polynomial added (2026-08-13) alongside adaptive_kernel_sampling above: it
  # was in data_gen._COMPOSABLE_KERNELS (the live-sampling pool) but had no
  # probe here, so it had no kernel_fit signal and adaptive_kernel_sampling
  # couldn't see it. periodic is kept for the kernel_fit/periodic/* diagnostic
  # (useful on its own even off the sampling curriculum), even though
  # composite_exclude_kernels (conf/data/gp_tasks.yaml) excludes it from the
  # live-sampling pool by default -- train.py's adaptive_kernel_sampling loop
  # now skips updating/logging val/kernel_sampling_weight for any family in
  # composite_exclude_kernels, so this probe no longer feeds a weight number
  # that would otherwise look meaningful but never actually move sampling.
  kernels: [dot_product, rbf, matern12, matern32, matern52, rational_quadratic, periodic, polynomial]
  synth_n_episodes: 64      # fixed episodes generated once per kernel family
  synth_seed: 20260718      # fixed seed -> same probe episodes every run
  # oracle_diag/gap_nll's episode count (train.py::_build_posterior_probe_batches),
  # defaulted to a much smaller 64 in code. Tied to training.val_episodes so
  # gap_nll is measured over the same number of episodes as the rest of val/'s
  # metrics instead of a separate, noisier small sample -- gp_analytical_posterior
  # is already called this many times per family in the kernel_fit/* loop above,
  # so the added per-validate() cost here is small by comparison.
  posterior_probe_n_episodes: ${training.val_episodes}
  # Context/test-set sizes for the probe, pinned independent of this run's own
  # conf/data/gp_tasks.yaml P_min/P_max/N_min/N_max (which do change between
  # runs) so kernel_fit/<family>/* stays a fixed, cross-run-comparable
  # benchmark instead of silently reshaping with each run's own data config.
  probe_P_min: 32
  probe_P_max: 512
  probe_N_min: 8
  probe_N_max: 1024

  # era5_fit/<region>/* validation metrics (see train.py::_build_era5_val_batches):
  # real ARCO-ERA5 spatial-correlation probes, one per eval/configs/regions.py
  # entry, scored against empirical Pearson correlation (no GP oracle exists for
  # real data, unlike kernel_fit/<family> above). Fetched/PIT'd once before
  # training starts and cached -- only the model forward pass re-runs every
  # validate() call. Kept deliberately small (grid_size/n_days_probe) since this
  # adds real forward passes to EVERY validation call, not a one-off sweep.
  era5_enabled: true
  era5_regions: [western_europe, north_atlantic_ocean, sahara_desert, himalaya_tibetan_plateau, amazon_basin]
  era5_grid_size: 24        # matches eval/configs/regions.py's low_context_7config/grid_resolution convention (grid=24, n_context=30 -> ~5% context fraction)
  era5_n_days_fetch: 60     # days fetched/cached per region (eval.configs.constants.N_DAYS)
  era5_n_days_probe: 3      # of those, how many are used as context-conditioning draws per validate() call
  era5_n_context: 30        # in-context sample size (eval.configs.constants.N_CONTEXT)
  era5_n_bins: 12           # distance bins for the correlation-vs-distance curve
  era5_seed: 20260818       # fixed seed -> same context sample/probe days every run

# training.live_source=era5's data knobs (src/era5_live_dataset.py). Ignored
# unless training.live_generation=true AND training.live_source=era5.
era5_live:
  # Local cache directory populated by `python eval/data/fetch_era5_global.py`
  # (full-globe monthly grids) -- every training/val episode is a random
  # in-memory crop of whatever's cached here, no GCS traffic during training.
  corpus_dir: ./eval/data/cache/era5_global
  # Grid resolution range (points per side of the sampled region's crop, D =
  # grid_size^2 total points) -- drawn per episode, matching the spread
  # eval/configs/regions.py's grid_resolution sweep profile already probes
  # (8..28) so finetuning covers the same resolution range validation does.
  grid_size_min: 8
  grid_size_max: 28
  # Region box size (degrees lat/lon half-width doubled), drawn per episode.
  # Box center is sampled area-uniformly over the whole globe (arcsin-of-
  # uniform latitude, uniform longitude -- see era5_global_corpus.py), so
  # "different geographic space" is a continuous draw, not a fixed region list.
  box_deg_min: 5.0
  box_deg_max: 25.0
  # Fraction of each episode's D grid points used as in-context (the rest,
  # capped at n_test_max, are the held-out target/query set).
  n_context_frac_min: 0.05
  n_context_frac_max: 0.4
  n_test_max: 256
  # Fixed validation set (era5_live_dataset.py::build_era5_fixed_val_batches),
  # separate from baselines.era5_regions' curated-region probes above.
  val_episodes: 200
  val_seed: 20260823

# LoRA fine-tuning of the TabICL backbone.
# Override from CLI: lora.enabled=true lora.rank=16 lora.stages=[icl,row]
lora:
  enabled: false
  rank: 8
  alpha: 16.0
  target: "qkvo"
  stages:
    - icl
