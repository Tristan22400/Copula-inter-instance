defaults:
  # Each conf/model/*.yaml is the single file for one experiment: it uses
  # `# @package _global_` to set both `model.*` (the copula head) and
  # `tabicl.*` (the backbone) in one place, so switching experiments is one
  # `model=...` override instead of coordinating a separate `tabicl:` group.
  - model: copula_prod
  - data: gp_tasks
  - _self_

seed: 42

wandb:
  project: copula-inter-instance
  entity: null   # override with your wandb username/org

training:
  device: auto
  batch_size: 16
  # torch.compile adds real overhead (first-step + recompiles on shape changes);
  # worth it for long runs, a drag while iterating quickly. Off by default.
  compile: false
  steps: 1000000
  warmup_steps: 1000
  clip_grad_norm: 1.0
  log_every: 100
  val_every: 1000
  save_every: 5000
  ckpt_dir: null
  # Path to a checkpoint saved by save_checkpoint() (model + optimizer +
  # scheduler + step). When set, model weights and optimizer/scaler state
  # (Adam/Muon moments, AMP grad scale) are restored, but the step counter
  # and LR scheduler always restart at 0 with a fresh warmup/cosine schedule,
  # so this run's step count tracks the new run rather than continuing the
  # checkpoint's. Everything else (steps, LR schedule, dataset, etc.) follows
  # this run's config, not the one baked into the checkpoint.
  # Usage: python src/train.py training.resume_ckpt=./checkpoints/copula_transformer/step_0029999.pt
  resume_ckpt: null
  dataset_dir: ./data/systematic_composition-k5/pit
  # Target validation-set size, shared by both the on-disk path (below, capped
  # at the dataset's total episode count) and live_generation (live_dataset.py)
  # — same knob so the val plots (e.g. val/corr_density) are comparable in
  # point count across modes instead of the disk path silently getting a
  # smaller val set on datasets under ~10k episodes.
  val_episodes: 100
  # Override for the on-disk dataset DataLoader worker count (train.py's
  # loader_num_workers). null keeps the built-in defaults (4 fixed-d, 2
  # variable-d) — set explicitly to tune, e.g. now that dataset.py loads
  # shards with mmap=True instead of an eager full copy.
  loader_num_workers: null
  # Live generation: skip dataset_dir entirely and generate episodes on the
  # fly via DataLoader workers (see live_dataset.py) — no disk reads/writes
  # for training data. Temporary, storage-constrained-environment mode;
  # false (default) uses the on-disk dataset_dir pipeline unchanged.
  live_generation: false
  # CPU-bound generation is heavier than a shard read; size to keep the GPU
  # fed. 16 (not 8) because generate_gp_batch's fixed per-call overhead means
  # aggregate worker throughput doesn't scale with batch_size on its own —
  # measured 8 workers falling behind at batch_size=256 (data=30-55ms/step,
  # more than the rest of the step combined) while 16 stayed flat
  # (data<1ms/step) at both batch_size=128 and 256 on a 44-core node. Bump
  # this further (in step with batch_size) if you have more cores and go
  # bigger; 16 was already at the floor — 24 gave no further improvement.
  live_num_workers: 8
  # generate_gp_batch() call size = batch_size * live_group_multiplier. Must be
  # a multiple of batch_size: generate_gp_batch samples kernel/P/N/active_dims
  # (and, for variable-d configs, d_features itself) once per call, shared by
  # every episode in it — collate_fn cannot pad across a mismatched feature
  # axis, so a batch straddling two differently-sampled calls would fail
  # exactly like the disk path's variable-d datasets without
  # ShardHomogeneousBatchSampler. 1 (one call per batch) is also close to the
  # throughput ceiling: generate_gp_batch has ~1s of fixed per-call setup
  # overhead, benchmarked ~1.2s/episode at call-size 1 vs ~0.03s/episode at
  # call-size 32 (2026-07-23) — small call sizes are both less safe and far
  # slower. Cross-batch diversity comes from live_num_workers running
  # independently-seeded streams, the live analogue of ShardBlockSampler.
  live_group_multiplier: 1
  live_val_seed: 20260723  # fixed seed for the validation set (independent of the training seed stream)
  # For sharded datasets: shuffle within blocks of this many shards at a time
  # (all shuffled together, IO-cache resident) instead of one global shuffle
  # across every shard — avoids thrashing the shard LRU cache on network
  # storage. Still a true per-epoch permutation, just chunked randomization.
  shard_block_shards: 16
  plot_val_every: 1000  # generate val plots every N steps (0 = never)
  # Muon optimizer (Jordan et al. 2024b / Moonlight Liu et al. 2025)
  muon_lr: 2.0e-4             # base LR; effective LR = muon_lr * 0.2 * sqrt(max(n,m))
  muon_lr_min: 1.0e-6         # cosine decay floor
  muon_momentum: 0.95
  muon_weight_decay: 0.01     # cautious weight decay (Chen et al. 2025a)
  muon_matched_adamw_rms: 0.2
  muon_ns_steps: 5
  muon_nesterov: true
  
  muon_adamw_betas: [0.95, 0.95]
  muon_adamw_eps: 1.0e-8
  # Scalar weight on the Y-space NLL (copula + marginal); 1.0 = standard.
  nll_weight: 1.0
  # Auxiliary MAE (L1) loss on off-diagonal correlations vs oracle R_star.
  # Provides a direct gradient signal and, unlike MSE, pushes near-zero
  # correlations to exact zero — encourages sparsity in the predicted
  # covariance structure. 0.0 disables it entirely.
  aux_mae_weight: 0.0

# Model-fit-to-classical-kernel diagnostic, evaluated each validation loop:
#   val/kernel_fit/<kernel>/{copula_nll,corr_mse,corr_mae,corr_pearson}
# For each kernel family below, a fixed batch of synthetic episodes is
# generated once (at startup) via data_gen.generate_gp_batch — the same
# (x_train, z_train, x_test, R_star, ...) construction as real training data,
# but with the generative kernel forced to that single family instead of this
# run's usual composite/systematic mixture. Every validation call then runs
# the CURRENT model on this frozen probe set, so kernel_fit/<kernel> moves
# with training progress (unlike a fixed, data-only baseline would).
baselines:
  enabled: true
  kernels: [dot_product, rbf, matern12, matern32, matern52, rational_quadratic, periodic]
  synth_n_episodes: 64      # fixed episodes generated once per kernel family
  synth_seed: 20260718      # fixed seed -> same probe episodes every run

# LoRA fine-tuning of the TabICL backbone.
# Override from CLI: lora.enabled=true lora.rank=16 lora.stages=[icl,row]
lora:
  enabled: false
  rank: 8
  alpha: 16.0
  target: "qkvo"
  stages:
    - icl
