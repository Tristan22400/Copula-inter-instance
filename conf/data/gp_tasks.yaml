# ---------------------------------------------------------------------------
# GP task generation config — inter-instance Gaussian copula
# ---------------------------------------------------------------------------

d_features: 10          # total feature columns; fallback used only when
                        # d_features_lognormal_loc/scale below are unset.

# Total feature count d ~ round(LogNormal(d_features_lognormal_loc,
# d_features_lognormal_scale)), clipped to a minimum of 2, sampled once per
# shard (every episode within one shard shares the same d — see
# data_gen.py::_sample_d_features). Defaults below (loc=log(10), scale=0.4)
# give d mostly in [5, 19], median 10 (matches the old fixed default).
# Comment out both keys to fall back to the fixed d_features above.
#
# IMPORTANT: since different shards can have different d, a training
# minibatch that spans shards would mix mismatched feature widths and crash
# dataset.py's collate_fn. When training on a dataset generated with this
# enabled, override training.shard_block_shards=1 (see conf/config.yaml —
# the default 16 shuffles across shards) and pick training.batch_size to
# evenly divide shard_size below, so every minibatch stays within one shard.
d_features_lognormal_loc: 2.302585    # log(10)
d_features_lognormal_scale: 0.4

# Kernel active-column selection (random per task, via gpytorch's own
# active_dims kernel kwarg — see data_gen.py::_sample_active_dims).
# A fraction ~ Uniform[inactive_frac_min, inactive_frac_max] of the
# d_features columns is left inactive (irrelevant noise the model must
# learn to ignore); the rest are the kernel's active_dims. Defaults below
# give k = d_features - round(frac*d_features) ~ {1,2,3,4} for d_features=10.
inactive_frac_min: 0.1
inactive_frac_max: 0.8

# Training/context set size range
P_min: 32
P_max: 32             # fewer train points → more residual posterior uncertainty

# Test/query set size range (copula is over these N instances)
N_min: 256
N_max: 256

# Number of tasks to generate
n_tasks: 20000000

# GP kernel hyperparameter priors (shared across all stationary kernels).
# lengthscale ~ LogNormal(l_lognormal_loc + l_lognormal_k_exponent *
# log(min(k, l_lognormal_k_cap)), l_lognormal_scale), where k = number of
# active kernel dims. Without the k-dependent shift, the k-dims-summed
# squared distance grows ~linearly in k for standardized iid inputs, so a
# fixed-in-k lengthscale collapses R_star toward the identity as k grows
# (see data_gen.py::_kernel_prior_spec). Re-tune against
# tests/test_dataset_corr_uniform.py's abs(mean)<0.30 bound if
# composite_exclude_kernels or the nugget prior change.
#
# Inputs are always per-episode z-normalized to std=1 (see generate_gp_batch),
# so l_lognormal_scale=0.5 put negligible mass on lengthscales long relative
# to that fixed ~unit-scale domain (<2% above l=3) -- near-constant-function
# episodes were almost never seen in training. Raised to 1.0 (pilot-validated:
# 3000-episode dataset + tests/test_dataset_corr_uniform.py) instead of adding
# a second mixture component -- a two-component mixture was tried first but
# empirically didn't outperform this simpler single-distribution widening on
# either the correlation-uniformity bounds or R_star conditioning.
l_lognormal_loc: 0.0    # log(1.0)
l_lognormal_scale: 1.0
l_lognormal_k_exponent: 0.5
l_lognormal_k_cap: 15
alpha2_gamma_concentration: 4.0   # outputscale ~ Gamma(concentration, rate)
alpha2_gamma_rate: 3.0

# ARD: sample one independent lengthscale per active kernel dimension
# (ard_num_dims=k) instead of one isotropic scalar shared across all k dims.
# Applies to rbf/matern32/periodic/rational_quadratic ("cosine"/"dot_product"
# can't be — see data_gen.py's module docstring). Default false preserves
# prior behaviour. "periodic" is always capped to k=1 active dims regardless
# (see data_gen.py).
ard: true

# Even when a kernel is ARD (via `ard: true` above), each episode
# independently has this probability of having its lengthscale (and
# periodic's period) collapsed to one shared value
# across active dims instead of one independent value per dim — i.e. an
# isotropic kernel in effect, mixed in among the ARD episodes. Default 0.0
# (no isotropic override) preserves prior behaviour. See
# data_gen.py::_build_scaled_kernel / _collapse_isotropic.
isotropic_ratio: 0.3

# MLP feature mixing: optionally entangle the d_features input columns
# through a small stack of random dense affine + nonlinearity layers,
# applied to the GP's INPUT coordinates x (never to sampled outputs y)
# before the existing per-episode z-normalisation -- preserves the EXACT
# analytic oracle. See data_gen.py::apply_mlp_feature_mixing.
# Default off: byte-for-byte no-op for every existing config/dataset.
mlp_mixing_enabled: true
# Fraction of episodes per generate_gp_batch call that get mixed at all
# (Bernoulli gate); the rest pass through unmixed, mirroring
# tabiclv2_warp_features's identity-transform choice.
mlp_mixing_prob: 0.9
# Number of mixing layers, sampled once per batch call (shared by every
# episode in that call). Kept small (1-2): each layer risks collapsing
# R_star toward independence or saturating an activation -- validate any
# change against tests/test_dataset_corr_uniform.py on a pilot dataset
# before a full generation run.
mlp_num_layers_min: 1
mlp_num_layers_max: 4
# Std of each layer's random weight matrix before 1/sqrt(d_features)
# fan-in scaling -- keeps the pre-activation roughly variance-preserving.
mlp_mix_weight_std: 1.0

# Kernel-hidden warp: optionally evaluate kernel_obj/mean_module (the R_star/
# Sigma_star/mu_star oracle, AND the actual GP draw y_all) on a further,
# HIDDEN-ONLY transform of x_norm that the model never sees -- unlike
# mlp_mixing above (which the model DOES see, since it runs before
# x_norm_train/x_norm_test are cut), this exists purely to stop the model
# from solving "predict R_star" by recognising the kernel family straight off
# its own input. See data_gen.py::apply_kernel_hidden_warp for why the
# down-projection bottleneck (not just extra depth) is what actually
# prevents this. Default off: byte-for-byte no-op for every existing
# config/dataset -- unvalidated at scale, same convention as
# structural_warp_enabled below; validate against
# tests/test_dataset_corr_uniform.py on a pilot dataset before enabling.
kernel_hidden_enabled: false
# Fraction of episodes per generate_gp_batch call that get the hidden warp
# at all (Bernoulli gate); the rest fall back to oracle == x_norm (same
# per-episode-gate convention as mlp_mixing_prob). Default 1.0 (always on
# once enabled) since this defines the generative ground truth, not a
# stylistic augmentation like mlp_mixing.
kernel_hidden_prob: 1.0
# Number of hidden mixing layers (at the reduced bottleneck width), sampled
# once per batch call. Kept small for the same reason as mlp_num_layers_*.
kernel_hidden_layers_min: 1
kernel_hidden_layers_max: 2
# Bottleneck width as a fraction of d_features: r = round(frac * d), clamped
# to [1, d-1] so it's always a genuine (non-trivial) rank reduction. This is
# the knob that matters -- fan-in-scaled d->d layers alone are close to an
# isometry (JL-type concentration) and can be absorbed as a single unknown
# lengthscale rescaling; the rank-deficient down-projection below is what
# actually destroys pairwise-distance ordering.
kernel_hidden_bottleneck_frac: 0.5
# Std of each layer's random weight matrix before fan-in scaling (same role
# as mlp_mix_weight_std, applied at each stage's own input width).
kernel_hidden_weight_std: 1.0

# Structural feature warp: optionally apply TempoPFN-inspired (github.com/
# automl/TempoPFN) transforms to each feature column independently, per
# episode -- mirrors TempoPFN's own 6-category orchestration
# (UnivariateOfflineAugmentor.apply): invariances (yflip/time_flip),
# structure (regime_change/shock_recovery), seasonality (amplitude
# modulation), artifacts (resample), analytic (smoothing/derivative/
# integral), discrete (quantize/censor). Runs on x alongside
# tabiclv2_warp_features/mlp_mixing (never on sampled y), so the same
# deterministic-feature-map argument keeps R_star/Sigma_star exact. See
# data_gen.py::apply_structural_feature_warp / _STRUCTURAL_CATEGORIES.
# Default off: byte-for-byte no-op for every existing config/dataset. Unlike
# mlp_mixing/mean_fn above, NOT turned on here yet -- validate against
# tests/test_dataset_corr_uniform.py on a pilot dataset before enabling by
# default; these transforms are new and unvalidated at scale.
structural_warp_enabled: true
# Per-(episode, column) probability of applying any transform at all.
structural_warp_prob: 0.3
# How many of the 6 categories to compose (sampled WITHOUT replacement,
# applied in the fixed category order below) per gated column -- mirrors
# TempoPFN's own num_ops=randint(2,6).
structural_warp_num_ops_min: 2
structural_warp_num_ops_max: 6
# Category weights, exactly TempoPFN's own defaults. One op is drawn per
# chosen category (uniform, except discrete: quantize 0.6 / censor 0.4, also
# matching TempoPFN) -- see data_gen.py::_CATEGORY_OPS/_CATEGORY_SUB_OP_WEIGHTS.
structural_warp_category_weights:
  invariances: 0.6
  structure: 0.6
  seasonality: 0.5
  artifacts: 0.3
  analytic: 0.4
  discrete: 0.6
# Pseudo-time axis for order-dependent ops (regime_change, shock_recovery,
# amplitude_modulation, differential, resample_artifact, time_flip): value-
# rank by default (decoupled from the train/test split, since the split is a
# plain row-index slice -- see data_gen.py::_structural_warp_column). Setting
# structural_warp_index_axis_enabled: true lets a structural_warp_index_axis_ratio
# fraction of gated columns instead use the raw row-index axis (a more
# faithful port of TempoPFN's real time axis), which *can* introduce a fixed
# train/test coupling for those columns. Off by default (ratio ignored unless
# enabled=true) -- switch off entirely by leaving structural_warp_index_axis_enabled
# at its default False, regardless of the ratio value.
structural_warp_index_axis_enabled: false
structural_warp_index_axis_ratio: 0.5

# Non-zero GP mean bank (CauKer-inspired, github.com/ShifengXIE/CauKer):
# CAUKER's own ablation (Table 1, "Mean+KernelSynth" vs zero-mean
# "KernelSynth") shows adding a non-zero mean is one of the two clearest
# wins in their pipeline (the other being the SCM causal graph, which this
# repo deliberately does NOT port to sampled outputs -- see
# apply_mlp_feature_mixing's docstring -- since that would force Monte
# Carlo and break the exact analytic R_star/Cholesky oracle). A non-zero
# *mean*, by contrast, is completely free: GP posterior covariance never
# depends on the mean function (only mu_star does), so this diversifies
# mu_star/z_train/z_test realism without perturbing R_star/Sigma_star at
# all. Covers all four of CauKer's own mean families -- Zero, Linear,
# Exponential, Sparse Anomalies. See data_gen.py::_sample_mean_module /
# _MeanFunctionBank / _GeneratorGP.
# Default off (byte-for-byte no-op, same convention as mlp_mixing_enabled)
# at the code level; turned on here.
mean_fn_enabled: true
# Per-episode probability of getting any non-zero mean at all (else exact
# ZeroMean).
mean_fn_prob: 0.5
# Conditional on non-zero (above), categorical weights over which family
# fires: [linear, exponential, anomaly] (data_gen.py::_MeanFunctionBank).
mean_fn_family_probs: [0.5, 0.25, 0.25]
# Within the linear family, probability it also carries a linear trend (a
# random direction across the full d-dimensional feature space) rather than
# being a constant-only offset.
mean_fn_linear_prob: 0.5
# Std of the linear family's per-episode random trend direction / constant
# offset. Kept modest relative to the GP's own alpha2 (outputscale) scale so
# the mean diversifies mu_star without dwarfing the kernel-driven signal --
# validate against tests/test_dataset_corr_uniform.py before raising.
mean_fn_weight_std: 0.5
mean_fn_bias_std: 1.0
# Exponential family: mu(x) = exp_scale * exp(exp_rate * <unit_direction, x>).
# exp_rate can be negative (decay) as easily as positive (growth) -- both are
# sampled symmetrically around 0 via these stds.
mean_fn_exp_rate_std: 0.5
mean_fn_exp_scale_std: 1.0
# Sparse-anomaly family: a spike of size ~N(0, mean_fn_anomaly_magnitude_std)
# added wherever a random unit-direction projection of x exceeds a threshold
# calibrated (via inverse normal CDF) to fire on approximately this fraction
# of instances.
mean_fn_anomaly_frac: 0.1
mean_fn_anomaly_magnitude_std: 2.0

# Nugget/noise: single diagonal regulariser ~ LogNormal(nugget_lognormal_loc,
# nugget_lognormal_scale), shared by ALL kernels — defaults to the tuned
# "HEBO+" noise prior from the PFN4BO paper (github.com/automl/PFNs4BO,
# Appendix B.1). Guarantees PSD and controls posterior tightness.
nugget_lognormal_loc: -4.63
nugget_lognormal_scale: 0.5

# Test-side oracle for R_star/mu_star/sigma_star (and hence z_test):
#   posterior: condition on the training context (K_ss − K_st K_ff⁻¹ K_ts) —
#              off-diagonal correlations shrink with more/closer train points.
#   prior:     raw kernel structure among test points only, ignoring the
#              training context entirely.
# z_train's LOO PIT is unaffected either way (always exact GP LOO on K_ff).
oracle_mode: prior

# ---------------------------------------------------------------------------
# Kernel selection
# ---------------------------------------------------------------------------
# Use a single fixed kernel:
#   kernel: rbf
# Or sample uniformly from a list each task:
#   kernels: [rbf, matern12, matern32, matern52, cosine, periodic, rational_quadratic, dot_product, polynomial]
#
# Available kernels: rbf, matern12, matern32, matern52, cosine, periodic, rational_quadratic, dot_product, polynomial
# (plus "A+B"/"A*B" composites of all 9 of those — see data_gen.COMPOSITE_KERNELS / data_gen._COMPOSABLE_KERNELS)
kernel: rbf

# Systematic composition (CauKer-style, github.com/ShifengXIE/CauKer): if
# true, ignores kernel/kernels above entirely and instead samples a random
# chain length M ~ round(LogNormal(composite_num_kernels_lognormal_loc,
# _scale)), clipped to [composite_num_kernels_min, composite_num_kernels_max],
# draws M elementary kernels with replacement from data_gen._COMPOSABLE_KERNELS
# (minus composite_exclude_kernels below), and combines them left-to-right
# with independently-sampled +/* operators — see data_gen.py::
# _sample_kernel_chain_structure / _build_kernel_chain. Produces chain names
# like "rbf+cosine*periodic" that are NOT in ALL_KERNELS/KERNEL_REGISTRY
# (unbounded cardinality) and are not reconstructible via build_kernel_fn.
#
# LogNormal (replacing an earlier Uniform[min, max], 2026-07-29) concentrates
# most episodes on short chains: long +/* chains empirically shrink |R_star|
# toward 0 (each "*" link damps magnitude, each "+" link averages toward the
# population mean via a CLT-like effect), which was the dominant reason
# extreme (near +-1) correlations were rare. loc=0.55/scale=1.05 give
# P(m=1)=0.45, P(m=2)=0.19, P(m=3)=0.11 (75% of episodes at m<=3, roughly
# preserving the old chain-length-1/2/3 relative 60:25:15 shape) and a
# decaying tail out to composite_num_kernels_max. Validated (many
# independent small-B generate_gp_batch calls — see the batch-sampling
# gotcha in data_gen.py's module docstring) against
# tests/test_dataset_corr_uniform.py: mean +0.166->+0.264 (still inside the
# abs(mean)<0.30 bound), frac(R>0.7) 0.093->0.179. Does not address the
# negative-correlation side (frac(R<-0.7) stays ~0.004-0.005) — that needs
# sign_modulation_component_prob/_outer_prob below, deliberately out of
# scope for this change.
systematic_composition: true
composite_num_kernels_min: 1
composite_num_kernels_max: 8
composite_num_kernels_lognormal_loc: 0.55
composite_num_kernels_lognormal_scale: 1.05
# Optional: drop elementary kernels from the systematic_composition sampling
# pool (data_gen._COMPOSABLE_KERNELS) without affecting the static
# COMPOSITE_KERNELS pool used by the non-systematic path. e.g. [periodic] to
# exclude periodic chains entirely. Empty = sample from all of
# data_gen._COMPOSABLE_KERNELS (rbf, matern12, matern32, matern52, cosine,
# periodic, rational_quadratic, dot_product, polynomial).
composite_exclude_kernels: [cosine,periodic,dot_product,polynomial]

# Extra hyperparameter priors (only used by the indicated kernels)
period_lognormal_loc: 0.1823    # log(1.2) — periodic kernel's `period` parameter
period_lognormal_scale: 0.4
rq_alpha_gamma_concentration: 2.0    # rational_quadratic kernel's `rq_alpha`
rq_alpha_gamma_rate: 1.0
poly_power_min: 2     # polynomial kernel's integer degree d, sampled once per
poly_power_max: 5     # generate_gp_batch call (shared by the whole batch — see data_gen.py)
poly_offset_gamma_concentration: 2.0    # polynomial kernel's offset c
poly_offset_gamma_rate: 1.0

# Sign-modulated (Schur product) kernel wrapper: K'(x1,x2) = K(x1,x2) *
# s(x1) * s(x2), s(x) = tanh(a*(w.x+b)), a random hyperplane split of the
# kernel's own active-column subspace, PSD via the Schur product theorem
# (rank-1 PSD s s^T times PSD K stays PSD, for ANY real-valued s — see
# data_gen.py::SignModulatedKernel) — see data_gen.py::SignModulatedKernel.
# w ~ N(0, I_k)/sqrt(k), b ~ N(0, 1), a ~ LogNormal(sharpness_lognormal_loc/
# _scale), one independent draw per episode. Injects negative pairwise
# correlation into R_star without touching oracle_mode or gp_posterior.
# tanh (replacing an earlier bare torch.sign()) trades the old hard +-1 flip
# (exact but with zero local gradient off a single measure-zero boundary —
# empirically unlearnable, since (w,b) is fresh per episode with no
# cross-episode transfer) for a smooth ramp of width ~1/a: large `a` recovers
# hard-sign behaviour (and its learnability problem) almost everywhere;
# small `a` smooths the transition over more of the input space at the cost
# of attenuating correlation magnitude there. See SignModulatedKernel's
# docstring for the full tradeoff.
sign_modulation_sharpness_lognormal_loc: 1.0986   # log(3.0) -- median sharpness a=3
sign_modulation_sharpness_lognormal_scale: 0.5
# Two independently-gated injection points, each a Bernoulli-per-batch-call
# coin flip (same granularity as mlp_mixing_prob — if it fires, EVERY episode
# in that generate_gp_batch call gets its own independent (w, b) draw):
#   sign_modulation_component_prob: applied per elementary kernel component,
#     inside data_gen.py::_build_kernel_component -- covers bare kernels,
#     both sides of a static "A+B"/"A*B" composite, and every link of a
#     systematic_composition chain, independently per component.
#   sign_modulation_outer_prob: applied once more to the fully composed
#     kernel (whole bare/composite/chain result), independently of the
#     per-component gate above.
# Both default to 0.0 (off) so existing datasets/behaviour are unaffected
# until explicitly turned on. See tests/test_dataset_corr_uniform.py's
# test_correlations_negative_fraction (25-75% band) before raising these on
# a production run.
#
# Tuning note (validated against the current systematic_composition mix,
# composite_num_kernels_max=8, composite_exclude_kernels below): counter-
# intuitively, a HIGH per-component prob is needed, not a low one. A single
# sign flip only inverts a "*"-multiplied sub-chain's contribution; on a
# "+"-summed term it just flips that one summand's sign within a sum still
# dominated by the other (unflipped) terms, so a naive-seeming 0.3-0.4
# barely moves the negative-fraction needle on long (up to 8-component)
# chains (measured neg_frac ~0.07-0.22 at prob 0.15-0.4, averaged over many
# independent batch-call draws). ~0.5+ was needed to reliably land in the
# 25-75% band (measured neg_frac ~0.27-0.41 at prob 0.5-0.7, mean ~0.09-0.16,
# std ~0.27-0.30). If composite_num_kernels_max/composite_exclude_kernels
# change, or systematic_composition is turned off (shorter/no chains), re-
# validate -- a fixed prob that works for 8-component chains will likely be
# too aggressive for bare/2-component kernels (e.g. prob=1.0 on a bare
# kernel already gives neg_frac ~0.36, see SignModulatedKernel's docstring).
sign_modulation_component_prob: 0.0
sign_modulation_outer_prob: 0.0

# PIT epsilon for probit clamping (analytical pipeline)
pit_eps: 1.0e-6

# z_train source for the on-disk dataset pipeline (generate_pit_dataset.py
# only -- live_generation/train.py's validation batches are unaffected and
# always use the analytic oracle, unlike z_train_corruption below which
# applies everywhere):
#   analytic: exact closed-form GP-LOO whitened residual (R&W Eq. 5.12) --
#             see data_gen.py::_generate_gp_batch_raw.
#   tabicl:   real K-fold PIT through the frozen TabICL marginal quantile
#             head (pit.py::run_pit_batched), the same approximate estimator
#             real (non-GP) deployment data would produce -- see
#             z_train_corruption's docstring below. Checkpoint comes from
#             cfg.tabicl.ckpt/cfg.tabicl.pit_ckpt (train.py::_resolve_pit_ckpt's
#             resolution order -- see conf/model/copula_prod.yaml), not a separate key
#             here. z_test/log_pdf_test are ALSO replaced with TabICL's own
#             PIT at the real x_norm_test/y_test (not just the ICL
#             conditioning input z_train) -- training's target matches what
#             train.py::validate's sim-to-real diagnostic (val/y_nll_copula)
#             later scores it against, the same way era5_live_dataset.py
#             already has to for real ERA5 data (no oracle exists there).
#             This was NOT always true: before 2026-08-24, only z_train
#             changed and z_test/log_pdf_test stayed the exact analytic-GP
#             oracle -- training against that clean target while
#             conditioning on noisy TabICL z_train taught an overconfident
#             Sigma that scored badly (positive, worse-than-independence
#             copula NLL) once validated against TabICL's own noisier
#             z_test. Confirmed via an A/B copula_nano run: val/y_nll_copula
#             went from persistently +0.09..+0.31 to persistently
#             ~-0.001..-0.009 across every validation checkpoint after this
#             change.
#   tabicl_split: same frozen TabICL marginal as "tabicl", but replaces the
#             K-fold rotation with a single forward pass
#             (pit.py::run_pit_calib_split_batched): an extra
#             z_train_split_calib_frac * P pool of points is drawn from the
#             same episode purely to serve as TabICL's context, every one of
#             the P training points is scored against it in one pass, and
#             the calibration pool is discarded (never saved). Costs 1
#             TabICL forward pass per shard-generation batch instead of
#             z_train_tabicl_k_folds+1 -- but every training point shares
#             that one, fixed-size context, instead of K-fold's ~P(K-1)/K-
#             sized context per point, so per-point PIT quality trades off
#             against z_train_split_calib_frac (and hence extra GP-sampling
#             cost) rather than against wall-clock. Same checkpoint
#             resolution as "tabicl", but NOT the same "only z_train changes"
#             guarantee: the calibration pool is deliberately included in the
#             episode's per-point feature normalization (so TabICL still
#             sees well-scaled input, benefiting from the larger sample when
#             z_train_split_calib_frac is large), which means x_norm_train/
#             x_norm_test/K_ff/K_ss/mu_star/sigma_star/R_star/z_test/
#             log_pdf_test all pick up a small, deliberate dependence on
#             z_train_split_calib_frac too -- a fully valid, self-consistent
#             episode either way, just not byte-identical to a
#             z_train_split_calib_frac=0 run at the same seed. See
#             data_gen.py::_generate_gp_batch_raw's tabicl_split_calib_frac
#             docstring for why a second renormalization pass after dropping
#             the calibration block would be worse (decouples the saved
#             coordinates from the already-computed oracle).
# "tabicl"/"tabicl_split" need network access on first run (downloads the
# checkpoint from HuggingFace) and are substantially slower than "analytic"
# ("tabicl": z_train_tabicl_k_folds+1 TabICL forward passes per shard-
# generation batch instead of one closed-form Cholesky; "tabicl_split": 1
# forward pass, but over a larger context) -- pilot on a small n_tasks before
# scaling a production run up.
z_train_source: tabicl
# K-fold count for z_train_source=tabicl's run_pit_batched call (same
# semantics/default as pit.py::DEFAULT_K_FOLDS). Ignored unless
# z_train_source=tabicl. Clamped into [2, P] by run_pit_batched regardless
# of this value.
#
# Each extra fold is a full extra TabICL forward pass (K+1 total per
# shard-generation batch), which looked like it'd force a quality/speed
# tradeoff -- but benchmarked 2026-08-23 on an RTX 6000 Ada, once
# training.live_tabicl_group_multiplier=2 and live_tabicl_num_workers
# auto-sizing (see conf/config.yaml) are in place, K barely affects
# real in-training data-wait at all: K=2/5/10 all measured ~1ms/step
# steady-state (vs the untuned baseline's ~85ms/step average, spiking to
# 170ms, at K=5 with live_tabicl_num_workers=2/live_tabicl_group_
# multiplier=1). With speed no longer a real constraint, K=10 wins on
# quality too: mean |z_tabicl - z_analytic| against the exact analytic
# GP-LOO residual (train.py::_compute_tabicl_z_train_gap) measured 0.534 at
# K=10 vs 0.557 at K=5 vs 0.657 at K=2 -- diminishing but still real
# returns to more folds (each fold holds out ~P/K points and scores them
# against the rest; K=10 is the closest of these to a true leave-one-out
# estimate). Lower this only if profiling on your own hardware shows
# workers falling behind (data= consistently above budget in train.py's
# perf: log line), not preemptively.
z_train_tabicl_k_folds: 5
# Calibration-pool size for z_train_source=tabicl_split's
# run_pit_calib_split_batched call, as a fraction of P (the episode's
# training-set size): P_C = max(1, round(z_train_split_calib_frac * P)).
# Not capped at 1.0 -- a calibration pool bigger than the training set itself
# (P_C > P) is expected and is the main lever for closing the K-fold quality
# gap noted above, at the cost of extra (cheap) GP-sampling work per episode.
# Ignored unless z_train_source=tabicl_split.
z_train_split_calib_frac: 1.0

# Adaptive real-TabICL z_train mixing for LIVE generation training only
# (live_dataset.py -- ignored by the on-disk generate_pit_dataset.py path,
# unlike z_train_source above). Orthogonal to z_train_source: instead of
# forcing EVERY episode onto the analytic oracle or the real TabICL PIT for
# the whole run, a per-kernel-family FRACTION of live-generation calls
# substitutes the real TabICL K-fold PIT (same run_pit_batched path
# z_train_source=tabicl uses) while the rest stay on the exact analytic
# residual -- so the model is trained mostly on the clean oracle signal but
# regularly sees the actual approximate signal real (non-GP) deployment data
# produces, concentrated on the kernel families where that approximation is
# worst.
#
# The per-family fraction is set ONCE at training startup (train.py::
# _compute_tabicl_z_train_gap / _tabicl_gap_to_mix_frac) by default, not
# re-adapted during training like training.adaptive_kernel_sampling's
# kernel_weights: the TabICL-vs-analytic z_train gap is a property of the
# frozen TabICL marginal's quantile-head approximation quality for that
# kernel family, not of the copula model being trained, so unlike
# adaptive_kernel_sampling's regret signal (which moves as the model
# improves) it isn't a moving target and doesn't strictly need re-measuring
# during training -- but see z_train_tabicl_mix_adaptive below to opt into
# periodic re-measurement anyway (e.g. if the TabICL checkpoint used for
# this diagnostic changes meaning across a long run, or just for closer
# monitoring). Families with a larger measured gap (harder for TabICL to
# approximate) get a higher mixing fraction, linearly interpolated between
# the floor and max fractions below over the observed [min_gap, max_gap]
# range across data_gen._COMPOSABLE_KERNELS.
#
# Requires training.live_generation=true and a resolvable TabICL checkpoint
# (same tabicl.ckpt/tabicl.pit_ckpt resolution as z_train_source=tabicl) and
# device="cuda" (CPU-only TabICL inference was benchmarked and rejected
# elsewhere in this codebase as too slow -- see live_dataset.py::
# build_live_train_loader). false (default) leaves live generation exactly
# as before this feature existed.
z_train_tabicl_mix_enabled: false
# Per-family mixing fraction when the measured TabICL-vs-analytic z_train
# gap is at its observed MINIMUM across _COMPOSABLE_KERNELS (never 0: even
# TabICL's best-approximated family should get occasional real-signal
# exposure, mirroring adaptive_kernel_sampling's anti-starvation floor).
z_train_tabicl_mix_floor_frac: 0.05
# Per-family mixing fraction when the measured gap is at its observed
# MAXIMUM. Kept well under 0.5 (real TabICL z_train stays the minority
# source even for the hardest family): z_train_tabicl_k_folds+1 TabICL
# forward passes per hit are substantially slower than the closed-form
# analytic path (see z_train_source's docstring above), and the floor/max
# split is meant to concentrate that cost on the families that most need it,
# not to approach the full z_train_source=tabicl override.
z_train_tabicl_mix_max_frac: 0.35
# false (default): the per-family gap/fraction above is measured once at
# startup and frozen for the whole run. true: also re-measure it every
# training.save_every checkpoint (train.py's _refresh_tabicl_mix_weights,
# called from the same block as save_checkpoint) -- reuses training.save_every
# rather than a separate cadence knob, since it's already 10x rarer than
# training.val_every by default and each re-measurement reloads the frozen
# TabICL marginal, regenerates data_gen._COMPOSABLE_KERNELS-worth of probe
# episodes, and frees it again (~1k+ extra episodes and a TabICL reload per
# refresh -- not free, hence tied to the rarer cadence and opt-in).
z_train_tabicl_mix_adaptive: false

# z_train corruption (see data_gen.py::corrupt_z_train's docstring): trains
# the model to be robust to z_train NOT being the exact closed-form GP-LOO
# whitened residual, since real (non-GP) deployment data can only ever
# produce an approximate PIT (measured to recover only a fraction of the
# correlation with the exact residual via TabICL's K-fold marginal quantile
# PIT, flat across k_folds). Lives
# here rather than conf/config.yaml: it's a modulation of z_train applied
# inside generate_gp_batch itself, read fresh every call — same convention
# as sign_modulation_component_prob/mlp_mixing_enabled/structural_warp_enabled/
# mean_fn_enabled above, and so applies uniformly (and invisibly to train.py)
# to every caller: the disk pipeline (generate_pit_dataset.py, baked
# permanently into the saved shards), live_generation (re-corrupted fresh
# every call), AND validation/kernel-probe batches (build_fixed_live_val_batches/
# _build_synthetic_kernel_batches in train.py). Off by default -- opt in per
# run/fine-tune.
z_train_corruption_enabled: false
# Fraction of episodes corrupted at all per generate_gp_batch call; the rest
# stay on the pristine closed-form signal so in-distribution sharpness isn't
# diluted more than needed.
z_train_corruption_prob: 1.0
# Beta(a, b) shape for the per-episode "signal fraction" rho (rho=1 leaves
# z_train untouched, rho=0 fully replaces it with i.i.d. N(0,1) noise).
# Defaults (3.5, 1.5) give E[sqrt(rho)] ~= 0.83 (corr(z_train, z_corrupted)
# in expectation) -- spread from p10~=0.66 (moderate) to p90~=0.96 (near-clean).
z_train_corruption_rho_beta_a: 3.5
z_train_corruption_rho_beta_b: 1.5

# Episodes per shard file (D: reduces NFS metadata ops by this factor).
# Increase for large datasets; 256 works well for P_max<=30, N_max<=50.
shard_size: 256

# Output directory
dataset_dir: ./data/systematic_composition
pit_dir: ${data.dataset_dir}/pit

# Resume from existing files if present
resume: false
