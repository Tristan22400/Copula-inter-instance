# @package _global_
# ---------------------------------------------------------------------------
# Copula Transformer — production preset (single file: backbone + head)
#
# Backbone: pretrained TabICL regressor (loaded from HuggingFace by
# `cfg.tabicl.ckpt`) with its quantile decoder replaced by nn.Identity().
# Architectural hyperparameters (d_model, n_heads, n_blocks, …) come from
# the checkpoint config — they are NOT specified here.
#
# The backbone is fine-tuned by default — copula correlation prediction is a
# different task from quantile regression so the features need to adapt.
#
# Uses `_global_` packaging so this one file (selected via `model=...`) sets
# both `model.*` (the copula head) and `tabicl.*` (the backbone) — the whole
# experiment in one edit. See conf/model/copula_nano.yaml for the
# from-scratch fast dev-loop counterpart.
# ---------------------------------------------------------------------------
model:
  rank: 32                  # low-rank dimension r in W ∈ R^{N×r}
  sigma_jitter: 1.0e-4     # added to diag(Σ) for Cholesky stability
  unfreeze_backbone: true  # train TabICL end-to-end alongside the head
  # Which src/correlation_factory.py builder turns the copula head's raw
  # output into a valid low-rank correlation matrix: covnorm (default,
  # matches the original hard-coded implementation) | cossim | tanhnorm |
  # sparse_covnorm. Override from CLI, e.g. model.correlation_parametrization=cossim.
  correlation_parametrization: covnorm

tabicl:
  pretrained: true   # false → randomly-initialised backbone (uses arch section below)
  ckpt: tabicl-regressor-v2-20260212.ckpt  # ignored when pretrained=false
  # Gradient checkpointing (torch.utils.checkpoint) through the pretrained
  # backbone's col/row/icl transformer stages: recomputes activations during
  # backward instead of holding them all, trading ~20-30% extra compute for a
  # large cut in peak activation memory. Attention length T=P+N (see
  # conf/data/gp_tasks.yaml N_max/P_max) dominates that memory; turn this on
  # instead of shrinking N_max/P_max/batch_size when hitting CUDA OOM.
  recompute: false
  # K-fold PIT (src/pit.py::run_pit) used only by the z_train sim-to-real
  # validation diagnostic (train.py::_build_tabicl_val_z) — a second, frozen
  # TabICL copy with its native quantile head PITs each val episode's own
  # (x_train, y_train) the same way real (non-GP) data would be, so the
  # model's correlation prediction can be checked against that approximate
  # z_train, not just the exact GP-LOO one. Matches pit.py's DEFAULT_K_FOLDS.
  # Fold count for the places the fold count is a free choice: the
  # kernel_fit/<family> probes and the z_train_tabicl_mix gap measurement.
  # It does NOT set the fold count val/y_nll_* is scored at when
  # data.z_train_source is "tabicl"/"tabicl_split" -- that follows
  # data.z_train_tabicl_k_folds, so the val marginal matches the one the
  # model was actually conditioned on (see train()'s val_pit_k_folds).
  pit_k_folds: 10
  # Architecture params — only used when pretrained=false.
  # Defaults match the released tabicl-regressor-v2 checkpoint.
  # arch:
  #   embed_dim: 128
  #   col_num_blocks: 3
  #   col_nhead: 8
  #   col_num_inds: 128
  #   row_num_blocks: 3
  #   row_nhead: 8
  #   row_num_cls: 4
  #   icl_num_blocks: 12
  #   icl_nhead: 8
  #   ff_factor: 2
  #   dropout: 0.0
