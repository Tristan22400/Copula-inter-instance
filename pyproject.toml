[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copula-inter"
version = "0.1.0"
description = "Inter-instance Gaussian copula training and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "gpytorch>=1.11,<2",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "pandas>=2.1,<3",
  "xarray>=2024.1",
  "wandb>=0.19,<1",
  "einops>=0.7,<1",
  "huggingface-hub>=0.25,<2",
  "tqdm>=4.64,<5",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3.6,<4", "ruff>=0.16,<0.17", "mypy>=1.11,<2"]
cpu = ["torch>=2.5,<3"]
gpu = ["torch>=2.5,<3"]
era5 = ["netCDF4>=1.7,<2", "dask[array]>=2024.1", "zarr>=3,<4", "gcsfs>=2024.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pypi", extra = "gpu" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
copula_inter = "src/copula_inter"
tabicl = "tabicl_upstream/src/tabicl"

[tool.setuptools.package-data]
conf = ["*.yaml", "data/*.yaml", "model/*.yaml"]

[tool.setuptools.packages.find]
where = [".", "src", "tabicl_upstream/src"]
include = ["copula_inter*", "conf*", "eval*", "inference*", "debug*", "experiments*", "tabicl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tabicl_upstream/src"]
addopts = "--strict-markers"
markers = [
  "gpu: requires a CUDA device",
  "pretrained: downloads or loads pretrained model weights",
  "external_data: requires datasets outside this checkout",
  "slow: exceeds the fast CPU budget",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tabicl_upstream", "*_upstream", ".claude/worktrees", ".codex"]

[tool.ruff.lint]
select = ["E9", "F", "I", "TC004"]

[tool.ruff.lint.isort]
known-first-party = ["copula_inter", "eval", "inference", "conf", "debug", "experiments", "scripts", "tabicl"]

[tool.mypy]
files = ["src/copula_inter", "eval", "inference", "conf", "debug", "experiments", "scripts", "tests"]
mypy_path = ["src", ".", "tabicl_upstream/src"]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "normal"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tabicl_upstream/", "_upstream/"]

[[tool.mypy.overrides]]
# Vendored upstream code: analysed for the types our code uses, never reported.
module = ["tabicl.*", "pfns4bo.*"]
ignore_errors = true
