[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copula-inter"
version = "0.1.0"
description = "Inter-instance Gaussian copula training and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "gpytorch>=1.11,<2",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "pandas>=2.1,<3",
  "xarray>=2024.1",
  "wandb>=0.19,<1",
  "einops>=0.7,<1",
  "huggingface-hub>=0.25,<2",
  "tqdm>=4.64,<5",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
cpu = ["torch>=2.5,<3"]
gpu = ["torch>=2.5,<3"]
era5 = ["netCDF4>=1.7,<2"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pypi", extra = "gpu" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
include-package-data = true
py-modules = [
  "artifacts", "autoregressive_baseline", "backend_registry",
  "classical_kernels", "config_path", "copula_backbones", "correlation_factory", "data_gen",
  "dataset", "dataset_manifest", "diag_kernels", "episode_contracts",
  "feature_transforms",
  "era5_live_dataset", "finetune_era5", "finetune_marginal",
  "generate_pit_dataset", "live_dataset", "lora", "loss",
  "marginal_backbones", "marginal_finetune", "model", "muon", "pit",
  "train", "training_core",
]

[tool.setuptools.package-dir]
"" = "src"
eval = "eval"
inference = "inference"
tabicl = "tabicl_upstream/src/tabicl"
conf = "conf"

[tool.setuptools.package-data]
conf = ["*.yaml", "data/*.yaml", "model/*.yaml"]

[tool.setuptools.packages.find]
where = [".", "tabicl_upstream/src"]
include = ["conf*", "eval*", "inference*", "tabicl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tabicl_upstream/src"]
addopts = "--strict-markers"
markers = [
  "gpu: requires a CUDA device",
  "pretrained: downloads or loads pretrained model weights",
  "external_data: requires datasets outside this checkout",
  "slow: exceeds the fast CPU budget",
]
